{% extends "base.html" %}

{% block title %}Gästbok{% endblock %}

{% block content %}
<section>
    <h2>Skriv ett inlägg</h2>
    <form action="{{ url_for('submit') }}" method="post">
        <textarea name="message" rows="3" required></textarea><br>
        <button type="submit">Skicka</button>
    </form>
</section>

<section>
    <h2>Inlägg</h2>
    {% if entries %}
        {% for entry in entries %}
            <p>{{ entry }}</p>
        {% endfor %}
    {% else %}
        <p>Inga inlägg än.</p>
    {% endif %}
</section>
{% endblock %}
